name: Cross-Platform Build & Package (Windows Runner)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform(s) to build'
        type: choice
        options:
          - all
          - windows
          - linux
        default: all
      configuration:
        description: 'Build Configuration'
        type: choice
        options:
          - Development
          - Shipping
        default: Shipping
      package_game:
        description: 'Cook & package full game (uncheck to only compile C++ code)'
        type: boolean
        default: true
      ue_root:
        description: 'Unreal Engine root on the runner (empty: mfport.toml, else the newest compatible install)'
        type: string
        default: ''

env:
  BUILD_CONFIG: ${{ github.event.inputs.configuration || 'Shipping' }}
  DO_PACKAGE: ${{ github.event.inputs.package_game != false }}
  UE_ROOT: ${{ github.event.inputs.ue_root }}

jobs:
  build:
    name: Build & Package (Self-Hosted Windows)
    runs-on: [ self-hosted, windows ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # keep what isn't in git: the maps and sounds Tools/mfport converted on this runner
          # (gitignored; a clean checkout has only the code and the test range)
          clean: false

      # ------------------------------------------------------------------------
      # The same script as a local build (Tools/package.py): engine lookup, pack labels, the
      # version, iostore paks. This repository is public and the runner keeps the converted content
      # (clean: false), so only the release leaves it: a --downloads build, the core pack alone
      # (Docs/Building.md), never the build folder or a team/ file. package.py names the file it
      # made (its step's `release` output). This build's other packs aren't uploaded to the download
      # server from here, so its Downloads page offers nothing: it plays the core maps
      # ------------------------------------------------------------------------
      - name: Compile (Windows)
        if: (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows') && env.DO_PACKAGE != 'true'
        shell: powershell
        run: python Tools\package.py Windows $env:BUILD_CONFIG --compile-only

      - name: Package release (Windows)
        id: windows
        if: (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows') && env.DO_PACKAGE == 'true'
        shell: powershell
        run: python Tools\package.py Windows $env:BUILD_CONFIG --downloads --zip release

      - name: Upload Windows release
        if: steps.windows.outputs.release
        uses: actions/upload-artifact@v7
        with:
          name: DesktopForces-Windows-${{ env.BUILD_CONFIG }}
          path: ${{ steps.windows.outputs.release }}
          compression-level: 0  # a zip already
          if-no-files-found: error

      # Linux, cross-compiled from Windows (Epic's clang toolchain)
      - name: Compile (Linux)
        if: (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux') && env.DO_PACKAGE != 'true'
        shell: powershell
        run: python Tools\package.py Linux $env:BUILD_CONFIG --compile-only

      - name: Package release (Linux)
        id: linux
        if: (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux') && env.DO_PACKAGE == 'true'
        shell: powershell
        run: python Tools\package.py Linux $env:BUILD_CONFIG --downloads --zip release

      - name: Upload Linux release
        if: steps.linux.outputs.release
        uses: actions/upload-artifact@v7
        with:
          name: DesktopForces-Linux-${{ env.BUILD_CONFIG }}
          path: ${{ steps.linux.outputs.release }}
          compression-level: 0  # a zip already
          if-no-files-found: error

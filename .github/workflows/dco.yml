# Every commit in a pull request must be signed off (CONTRIBUTING.md, DCO).
name: DCO
on: pull_request

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: .* <.*>'; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line (git commit -s, see CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing

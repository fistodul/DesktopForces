# mfport configuration. Copy to mfport.toml (git-ignored) and adjust.
# Relative paths are relative to this folder (Tools/mfport).
# Any key can also be set by an environment variable MFPORT_<KEY>, e.g. MFPORT_GAME_DIR.

# Your Mobile Forces install (the folder holding System/, Maps/, Textures/ ...).
game_dir = "../../../MoFo/MobileForces"

# Scratch space for exported / converted files (never committed).
work_dir = "work"

# Unreal Engine 5 root (holding Engine/) and the project file.
ue_root = "../../../Linux_Unreal_Engine_5.8.3"
uproject = "../../DesktopForces.uproject"

# Wine command used to run the game's UCC.exe on Linux/macOS (ignored on Windows).
wine = "wine"

# Imported textures are downscaled to at most this many pixels per side.
# MF originals are 64-512 px, so 512 keeps them all at full resolution; mobile builds
# cook World textures down to 256 (Config/DefaultDeviceProfiles.ini). Remastered
# overrides can be larger - raise this to keep them.
max_texture_size = 512

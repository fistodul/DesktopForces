# Changes made to Mobile Forces maps when converting them (`mfport.py map`, mflib/mapedits.py).
#
# MF servers changed some maps at run time with mods; here the maps carry those changes
# themselves (the converted map has the vehicle generators, like any it was made with):
#   add_vehicles   extra vehicle generators (Gregaras' mutPack addVehicles default spots;
#                  "...Unboxed" map versions were merged into the regular maps)
#   generators     change a map's generators: { class = "<MF generator class>",
#                  vehicle = "<MF vehicle class>" } turns every one of that class into a
#                  VehicleGenerator of that vehicle
# Vehicle classes as MF names them: Rage.Buggy / Humvee / Truck / Armadillo, heli.heli,
# heli.heliHmg, jeep.jeep, boat.boat, piper.piper, piper.piperTs. Locations in cm, yaw in
# degrees (mutPack genLoc x 2.25, genRot / 65536 x 360).
#
# Server admins can still add or swap vehicles without converting maps again:
# UMFGameSettings AddedVehicles / VehicleSwaps (Game.ini).

["BR-thebigisland"]
# its truck was placed for the servers' replaceVehicles to make a heli
generators = [{ class = "TruckGenerator", vehicle = "heli.heli" }]


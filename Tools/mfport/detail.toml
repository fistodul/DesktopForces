# Textures seen up close: allowed to detail_texture_size (mfport.toml, 1024) instead of
# max_texture_size (512). Cooked to 512 on phones where everything else gets 256 (Config/
# DefaultDeviceProfiles.ini, the Detail group, TEXTUREGROUP_Project01).
#
#   packages   whole packages, for art that really has the pixels: weapons held in front of the
#              camera, and maps whose walls were painted at 1024+.
#   textures   single textures. Generated replacement art is drawn at twice the size for these
#              (lookalike.py). Picked per map by how much of it they cover (Tools/artgen/closeups.py).
#
# Classic retail art stops at 512; listing it would only make it bigger, not sharper.


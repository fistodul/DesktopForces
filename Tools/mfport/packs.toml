[unverified]
# Mod packages the community servers run whose authors / asset sources are still being
# checked (2026-10-21: the team is looking them up; models often come from free Sketchfab
# assets, which need their CC licence and author credited). Their code may be ported into the
# game; their models, textures and sounds land here.
root = "/MobileForcesUnverified"
packages = [
  "ak74", "m4a1", "F2000", "SC20K", "mac10", "m24", "m18", "m87", "desert", "famas", "g36", "glock",
  "ultimax", "wa2000", "improvedRL", "OPWeapons", "mineGenerator", "BoxPhysics",
  "Serious", "SwatSkin", "SwatGfx", "m871", "Glock",
]

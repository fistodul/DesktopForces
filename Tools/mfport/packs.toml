# Content packs: which converted content is community content whose authors agreed ("community":
# offered with Desktop Forces, the community pack), which stays
# in the Mobile Forces Classic plugin ("classic", /MobileForcesClassic/...: the retail game,
# converted from the player's own copy, never distributed) and which is community content whose
# authors haven't agreed yet ("unverified", the Mobile Forces Unverified plugin,
# /MobileForcesUnverified/...: the custom maps and mods of the community servers; offered as an
# in-game download, not committed; once its authors agree it moves to [community]).
# (The game's own content, /Game/MF, is "core": the pak every build carries; not listed here.)
#
# Rules (mflib/packs.py):
#   - everything from the retail game is classic, whatever this file says
#   - a map / package listed under [community.maps] / [community.packages] is community, as is a
#     community map's own
#     package (textures saved inside the map file)
#   - a package listed under [classic] stays classic (local only) though it isn't retail
#   - everything else is unverified (2026-10-29, Filip: custom maps by authors not asked yet,
#     before that they were classic)
#   - replacement art (overrides/textures/...) is community: /Game/MF/Replacements; community maps use it,
#     classic maps keep the original texture unless remaster_classic = true
#
# A community map can still use classic textures; `mfport.py packs` lists what each one still
# needs from the original game (the backlog for replacement art).
#
# Authors who agreed so far (Filip, 2026-10-20 / 21): AKVARI (Akvarinja: MF-Filip, MF-Stuck,
# MF-RandomLand, MF-TurpowiaV1, the Zombura and Coop maps), Edgaras "Gregaras" Ziaugra,
# Marcin / Marcinbydg / Loser (the Polish maps), Ahmed Isaac Alizai, Gian (also Peto /
# "Secret Dude": MF-Aquarius, the grenade launcher), BR-thebigisland. MF-SpaceZombura is an old
# copy of ZM-SpaceZombura: left out.
# Ask before adding anyone else.

community_root = "/Game/MF/Community" # textures, sounds, music of community content
community_maps_root = "/Game/Maps"    # community maps: /Game/Maps/<map>, data in <map>_Data
classic_root = "/MobileForcesClassic" # the plugin (Plugins/MobileForcesClassic)
remaster_classic = false              # true: classic maps use replacement art too


# Content packs: which converted content belongs to Desktop Forces itself ("core"), which stays
# in the Mobile Forces Classic plugin ("classic", /MobileForcesClassic/...: needs the player's
# own copy of the original game, never distributed with Desktop Forces) and which is community
# content nobody has vouched for yet ("unverified", the Mobile Forces Unverified plugin,
# /MobileForcesUnverified/...: generated locally like classic, never committed or shipped
# until its authors and its assets' sources are known; then it moves to [core.packages]).
#
# Rules (mflib/packs.py):
#   - everything from the retail game is classic, whatever this file says
#   - a converted map is classic unless it is listed under [core.maps]
#   - a texture / sound / music package is classic unless it is listed under [core.packages]
#     or it is a core map's own package (textures saved inside the map file)
#   - replacement art (overrides/textures/...) is core: /Game/MF/Replacements; core maps use it,
#     classic maps keep the original texture unless remaster_classic = true
#
# A core map can still use classic textures; `mfport.py packs` lists what each core map still
# needs from the original game (the backlog for replacement art).
#
# Authors who agreed so far (Filip, 2026-10-20 / 21): AKVARI (Akvarinja: MF-Filip, MF-Stuck,
# MF-RandomLand, MF-TurpowiaV1, the Zombura and Coop maps), Edgaras "Gregaras" Ziaugra,
# Marcin / Marcinbydg / Loser (the Polish maps), Ahmed Isaac Alizai, Gian (also Peto /
# "Secret Dude": MF-Aquarius, the grenade launcher), BR-thebigisland. MF-SpaceZombura is an old
# copy of ZM-SpaceZombura: left out.
# Ask before adding anyone else.

core_root = "/Game/MF/Community"      # core textures, sounds, music of community content
core_maps_root = "/Game/Maps"         # core maps: /Game/Maps/<map>, data in <map>_Data
classic_root = "/MobileForcesClassic" # the plugin (Plugins/MobileForcesClassic)
remaster_classic = false              # true: classic maps use replacement art too

[core.maps]
"COOP-CoopOneUpdate" = "AKVARI (Akvarinja)"
"MF-Filip" = "AKVARI (Akvarinja)"
"ZM-SpaceZombura" = "AKVARI (Akvarinja)"
"MF-Stuck" = "AKVARI (Akvarinja)"
"MF-TurpowiaV1" = "AKVARI (Akvarinja)"
"MF-RandomLand" = "AKVARI (Akvarinja)"
"MF-Aquarius" = "Gianfrutta (Gian)"
"MF-Test_Facility" = "Ahmed Isaac Alizai"

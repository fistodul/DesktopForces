# Replacement art for textures that core maps still borrow from the original game
# (`python3 Tools/mfport/mfport.py packs` lists them). `python3 Tools/artgen/lookalike.py`
# makes each one with a procedural generator; dark / mid / light colours come from the
# original unless given here ([r, g, b]). Output: Tools/mfport/overrides/textures/...
#
# Generators and their options (see lookalike.py):
#   noise       beta, contrast, spots, spot_size, streaks, stains, band = {height, color}
#   bricks      rows, cols, mortar, mortar_color, offset
#   tiles       n, grout, grout_color, diamond
#   planks      n, vertical, rings, gap, weathered, nails, frame
#   plywood     frame, emblem = {size, color, opacity}
#   corrugated  ridges, vertical, rust, rust_color, seam
#   siding      n, vertical
#   treadplate  n
#   grate       n, wire
#   panel       border, rust, rust_color, flanges, rivets = {cols, rows}, bolt
#   pipes       n
#   lamp        kind = round | grid | tube, n, glow, housing, back
#   sign        color, mark
#   flat        top, bottom
# Every entry may set scale (default 2: 256 px originals become 512, our cap).

# --- MF-Filip (AKVARI) ------------------------------------------------------------------

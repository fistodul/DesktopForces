; Phones: cap the frame rate and render below native resolution so the game leaves the CPU / GPU
; room for the system (uncapped 120 FPS at 2424x1080 made Android's System UI stop responding).
; Raise them in Options > Video > Advanced. UDFUserSettings::SetToDefaults has the same values.
; Render scale 1 is already below native: the content scale's 720 lines (1616x720 on a 2424x1080
; panel); 0.75 did nothing until render scale drove the content scale (2026-11-14) and would now
; drop phones to 1208x536, HUD included.
[/Script/DesktopForces.DFUserSettings]
bUseVSync=True
FrameRateLimit=30.000000
RenderScale=1.000000

; Editor viewport scalability: start on Low so the editor runs on low-spec machines.
; (Each user's choice is saved to Saved/Config/<Platform>Editor/EditorSettings.ini.)
[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=0
sg.AntiAliasingQuality=0
sg.ShadowQuality=0
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=0
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.ShadingQuality=0
sg.LandscapeQuality=0

[/Script/UnrealEd.EditorPerformanceSettings]
bThrottleCPUWhenNotForeground=True
bMonitorEditorPerformance=False

+DirectoriesToAlwaysCook=(Path="/MobileForcesUnverified/Materials")
+DirectoriesToAlwaysCook=(Path="/MobileForcesUnverified/Textures")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; content packs as separate paks: pakchunk0 core, 1 community, 2 unverified, 3 classic
; (PrimaryAssetLabel assets in the pack roots, DFImport -steps=packs; Tools/package.py makes them)
bGenerateChunks=True
; Tools/package.py --downloads writes Downloads/ContentBuildId.txt (UDFDownloads)
+DirectoriesToAlwaysStageAsUFS=(Path="Downloads")
; ChunkDownloader holds a whole file in memory while downloading it: containers in 64 MB parts
; (pakchunk1-<Platform>.ucas, _s1.ucas ...), also the unit a cut-off download resumes from
MaxIoStorePartitionSizeMB=64


+DirectoriesToAlwaysCook=(Path="/Game/MF")
+DirectoriesToAlwaysCook=(Path="/MobileForcesClassic/Effects")
+DirectoriesToAlwaysCook=(Path="/MobileForcesClassic/Fonts")

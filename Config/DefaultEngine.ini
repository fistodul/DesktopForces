; =============================================================================
; Mobile Forces - engine configuration
; Target: mobile-class rendering everywhere (also on desktop) so the game runs on
; potato PCs and phones. Rules (see Docs/Performance.md):
;   * forward shading, MSAA, no post-processing
;   * baked (static) lighting only; no Lumen, no Nanite, no virtual shadow maps,
;     no ray tracing, no distance fields, no virtual textures, no Substrate
;   * SM5 / ES3.1 shader targets only (fewer permutations = faster shader compiles)
; =============================================================================


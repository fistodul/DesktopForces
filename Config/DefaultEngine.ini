+SupportedAgents=(Name="Default",Color=(B=0,G=75,R=38,A=164),DefaultQueryExtent=(X=50,Y=50,Z=250),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=38.25,AgentHeight=175.5,AgentStepHeight=56.25,NavWalkingSearchHeightScale=0.5,PreferredNavData="/Script/NavigationSystem.RecastNavMesh",bCanCrouch=True,bCanJump=True,bCanWalk=True,bCanSwim=True,bCanFly=False)

[/Script/NavigationSystem.RecastNavMesh]
; agent = MF player capsule (17 x 39 uu)
AgentRadius=38.250000
AgentHeight=175.500000
; Cell size / step height are per resolution (Low, Default, High) since UE 5.2; the flat
; CellSize/AgentMaxStepHeight keys are ignored. Step = MF MaxStepHeight 25 uu (MF stairs are
; 16 uu = 36 cm, just over UE's 35 cm default).
NavMeshResolutionParams[0]=(CellSize=38.0,CellHeight=10.0,AgentMaxStepHeight=56.25)
NavMeshResolutionParams[1]=(CellSize=19.0,CellHeight=10.0,AgentMaxStepHeight=56.25)
NavMeshResolutionParams[2]=(CellSize=9.5,CellHeight=5.0,AgentMaxStepHeight=56.25)
; A* node budget per query (default 2048 gives partial paths across big MF maps; ~50 B/node)
DefaultMaxSearchNodes=16384
; MF levels are full of ledges you drop from (MF bots had JumpSpots). Experimental UE link
; generation adds drop-down links; depth stays under the fall damage threshold
; (1687.5^2 / (2 * 2137.5) = 666 cm). Down only: bots don't jump up ledges yet.
bGenerateNavLinks=True
+NavLinkJumpConfigs=(bEnabled=True,Name="DropDown",JumpLength=150.0,JumpDistanceFromEdge=10.0,JumpMaxDepth=650.0,JumpHeight=50.0,JumpEndsHeightTolerance=80.0,SamplingSeparationFactor=2.0,FilterDistanceThreshold=150.0,DownDirectionAreaClass="/Script/NavigationSystem.NavArea_Default",UpDirectionAreaClass=None)


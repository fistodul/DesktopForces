; Overrides on top of Engine/Config/BaseScalability.ini.
; MSAA is the only anti-aliasing (no post-process AA); scale it with AA quality.
[AntiAliasingQuality@0]
r.MSAACount=1
r.FXAA.Quality=0
[AntiAliasingQuality@1]
r.MSAACount=2
[AntiAliasingQuality@2]
r.MSAACount=4
[AntiAliasingQuality@3]
r.MSAACount=4
[AntiAliasingQuality@Cine]
r.MSAACount=8

; Post-processing is off up to High; Epic adds cheap bloom (ADFCharacter turns it on for
; PostProcessQuality >= 3). Players change levels in options or with `scalability 0-3`.
[PostProcessQuality@0]
r.Tonemapper.Quality=0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=0
[PostProcessQuality@1]
r.Tonemapper.Quality=0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=0
[PostProcessQuality@2]
r.Tonemapper.Quality=0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=0
[PostProcessQuality@3]
r.Tonemapper.Quality=1
r.BloomQuality=3
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=0

; Sharper textures at grazing angles on better hardware
[TextureQuality@0]
r.MaxAnisotropy=0
; potato: sample one mip down (512 px textures draw as 256; mfport max_texture_size=256 also halves memory)
r.MipMapLODBias=1
[TextureQuality@1]
r.MaxAnisotropy=2
r.MipMapLODBias=0
[TextureQuality@2]
r.MaxAnisotropy=4
[TextureQuality@3]
r.MaxAnisotropy=8

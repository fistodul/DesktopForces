; Overrides on top of Engine/Config/BaseScalability.ini.
; MSAA is the only anti-aliasing (no post-process AA); scale it with AA quality.
[AntiAliasingQuality@0]
r.MSAACount=1
r.FXAA.Quality=0
[AntiAliasingQuality@1]
r.MSAACount=2
[AntiAliasingQuality@2]
r.MSAACount=4
[AntiAliasingQuality@3]
r.MSAACount=4
[AntiAliasingQuality@Cine]
r.MSAACount=8

; Post-processing stays minimal at every level (tonemapper only).
[PostProcessQuality@0]
r.Tonemapper.Quality=0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=0
[PostProcessQuality@1]
r.Tonemapper.Quality=0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=0
[PostProcessQuality@2]
r.Tonemapper.Quality=0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=0
[PostProcessQuality@3]
r.Tonemapper.Quality=1
r.BloomQuality=0

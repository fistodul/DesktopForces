; =============================================================================
; Desktop Forces - Linux only (UE reads Config/<Platform>/<Platform>Engine.ini on that platform)
; =============================================================================

[ConsoleVariables]
; Vulkan (Linux): don't make the CPU wait on the swapchain image's fence. Works around a
; SIGSEGV in NVIDIA's libnvidia-glcore.so when the swapchain is recreated (resizing, editor
; menus / tooltips). The GPU still waits on the image's semaphore, so frames stay in order.
r.Vulkan.CpuWaitForFence=0
